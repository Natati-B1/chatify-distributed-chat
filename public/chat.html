<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat — Chatify</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/chatify.css" />
  </head>
  <body>
    <div class="chat-app">
      <aside class="chat-sidebar" aria-label="Contacts">
        <div class="chat-sidebar__header">
          <div class="brand brand--light">
            <svg class="brand__icon" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <rect width="40" height="40" rx="12" fill="#6366F1" />
              <path
                d="M12 14h16v12H12V14zm2 2v8h12v-8H14zm2 2h8v1h-8v-1zm0 2.5h6v1h-6v-1zm0 2.5h8v1h-8v-1z"
                fill="white"
              />
              <circle cx="30" cy="10" r="3" fill="#A5B4FC" />
            </svg>
            Chatify
          </div>
        </div>
        <div class="chat-sidebar__search">
          <label for="contactSearch" class="visually-hidden">Search users</label>
          <input type="search" id="contactSearch" placeholder="Search users..." autocomplete="off" />
        </div>
        <div class="chat-sidebar__section">
          <span>CONTACTS</span>
          <button type="button" id="btnAddContact" title="Add contact" aria-label="Add contact">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 5v14M5 12h14" />
            </svg>
          </button>
        </div>
        <div class="chat-contacts" id="contactList" role="list"></div>

        <div class="chat-sidebar__profile" id="profileCard">
          <button type="button" class="chat-sidebar__profile-trigger" id="profileToggle" aria-expanded="false" aria-haspopup="true">
            <div class="contact__avatar chat-profile__avatar" id="profileAvatar">?</div>
            <div class="chat-profile__meta">
              <span class="chat-profile__name" id="profileName">Account</span>
              <span class="chat-profile__email" id="profileEmail"></span>
            </div>
            <svg class="chat-profile__chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M6 9l6 6 6-6" />
            </svg>
          </button>
          <div class="chat-profile__menu" id="profileMenu" role="menu" hidden>
            <button type="button" class="chat-profile__menu-item" id="btnLogout" role="menuitem">Log out</button>
          </div>
        </div>
      </aside>

      <section class="chat-main" aria-label="Conversation">
        <header class="chat-toolbar">
          <div class="chat-toolbar__user">
            <div class="contact__avatar" id="activeAvatar">—</div>
            <div class="chat-toolbar__meta">
              <h2 id="activeName">Contacts</h2>
              <p id="activeStatus">
                <span class="contact__status-dot" aria-hidden="true"></span>
                <span id="activeStatusText">Loading…</span>
              </p>
            </div>
          </div>
          <div class="chat-toolbar__actions">
            <button type="button" aria-label="Search in conversation">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="7" />
                <path d="M21 21l-4.3-4.3" />
              </svg>
            </button>
            <button type="button" aria-label="Voice call">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path
                  d="M22 16.92v3a2 2 0 01-2.18 2 19.8 19.8 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.8 19.8 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72c.12.86.3 1.7.54 2.5a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.58-1.11a2 2 0 012.11-.45c.8.24 1.64.42 2.5.54A2 2 0 0122 16.92z"
                />
              </svg>
            </button>
            <button type="button" aria-label="More options">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                <circle cx="12" cy="5" r="2" />
                <circle cx="12" cy="12" r="2" />
                <circle cx="12" cy="19" r="2" />
              </svg>
            </button>
          </div>
        </header>

        <div class="chat-messages" id="messageList" role="log" aria-live="polite" aria-relevant="additions"></div>

        <footer class="chat-composer">
          <button type="button" class="chat-composer__attach" aria-label="Attach file">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path
                d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"
              />
            </svg>
          </button>
          <label for="messageInput" class="visually-hidden">Message</label>
          <input type="text" id="messageInput" placeholder="Type a message..." autocomplete="off" />
          <button type="button" class="btn-send" id="btnSend" aria-label="Send message">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z" />
            </svg>
          </button>
        </footer>
      </section>
    </div>

    <style>
      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
    </style>
    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/chat.js" type="module"></script>
  </body>
</html>
