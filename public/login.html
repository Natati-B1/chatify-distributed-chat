<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login — Chatify</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/chatify.css" />
  </head>
  <body>
    <div class="login-page">
      <div class="login-card">
        <div class="brand">
          <svg class="brand__icon" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <rect width="40" height="40" rx="12" fill="#6366F1" />
            <path
              d="M12 14h16v12H12V14zm2 2v8h12v-8H14zm2 2h8v1h-8v-1zm0 2.5h6v1h-6v-1zm0 2.5h8v1h-8v-1z"
              fill="white"
            />
            <circle cx="30" cy="10" r="3" fill="#A5B4FC" />
          </svg>
          Chatify
        </div>
        <h1>Welcome Back!</h1>
        <p class="sub">Login to continue chatting.</p>

        <div id="loginError" class="login-error" role="alert"></div>

        <form id="loginForm" novalidate>
          <div class="form-group">
            <label for="email">Email</label>
            <div class="input-wrap">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" />
                <path d="M22 6l-10 7L2 6" />
              </svg>
              <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required />
            </div>
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <div class="input-wrap">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <rect x="5" y="11" width="14" height="10" rx="2" />
                <path d="M7 11V8a5 5 0 0110 0v3" />
              </svg>
              <input
                id="password"
                name="password"
                type="password"
                autocomplete="current-password"
                placeholder="••••••••"
                required
              />
            </div>
          </div>
          <div class="login-row">
            <label><input type="checkbox" name="remember" id="remember" /> Remember me</label>
            <a href="#" id="forgotLink">Forgot Password?</a>
          </div>
          <button type="submit" class="btn btn--primary btn--block">Login</button>
        </form>

        <p class="login-footer">Don't have an account? <a href="/register.html">Sign up</a></p>
      </div>
    </div>
    <script src="/js/login.js" type="module"></script>
  </body>
</html>
