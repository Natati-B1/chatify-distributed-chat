services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  chat-server-1: &app
    build: .
    restart: unless-stopped
    ports:
      - "5001:3000"
      
      - "3000:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      COOKIE_SECURE: "false"
      SESSION_SECRET: ${SESSION_SECRET:-docker-dev-change-me}
      MONGODB_URI: mongodb://mongo:27017/chatify
      REDIS_URL: redis://redis:6379

      PUBLIC_ORIGIN: http://localhost:8080,http://127.0.0.1:8080,http://localhost:3000,http://127.0.0.1:3000,http://localhost:5001,http://localhost:5002,http://localhost:5003
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  chat-server-2:
    <<: *app
    ports:
      - "5002:3000"

  chat-server-3:
    <<: *app
    ports:
      - "5003:3000"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - chat-server-1
      - chat-server-2
      - chat-server-3

volumes:
  mongo_data:
